name: Strip Claude co-author

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: strip-claude
  cancel-in-progress: false

jobs:
  strip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rewrite history if needed
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          bash .github/scripts/strip-claude.sh | tee out.txt
          if grep -q rewritten out.txt; then
            git push --force-with-lease=main:${{ github.sha }} origin HEAD:main
          fi
