name: Backend Docker CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/docker-ci.yml'
  workflow_dispatch:

jobs:
  build-and-push-backend:
    name: Build & Push Backend Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata and lowercase image name
        id: meta
        run: |
          REPO_NAME="${{ github.repository }}"
          # GHCR bắt buộc tên image phải viết thường toàn bộ (lowercase)
          IMAGE_NAME="ghcr.io/${REPO_NAME,,}-backend"
          echo "image_name=$IMAGE_NAME" >> $GITHUB_OUTPUT
          echo "Target Image Name: $IMAGE_NAME"

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image_name }}:latest
            ${{ steps.meta.outputs.image_name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Trigger Backend Deployment
    needs: build-and-push-backend
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Webhook (Render / Koyeb)
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$DEPLOY_HOOK_URL" ]; then
            echo "🚀 Triggering cloud deployment webhook..."
            curl -X POST "$DEPLOY_HOOK_URL"
          else
            echo "ℹ️ Biến DEPLOY_HOOK_URL chưa được cấu hình trong GitHub Secrets."
            echo "Docker image Backend đã được build và lưu thành công trên GHCR."
          fi
